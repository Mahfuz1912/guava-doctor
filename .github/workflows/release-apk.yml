
name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.2)'
        required: true
        default: 'v2.2'

      release_notes:
        description: 'Optional release notes (Bangla / English)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Setup Gradle with caching
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Decode signing keystore
      - name: Decode keystore
        id: signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode \
              > "${GITHUB_WORKSPACE}/my-upload-key.jks"

            chmod 600 "${GITHUB_WORKSPACE}/my-upload-key.jks"

            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Release signing configured."

          else
            echo "::error::Release signing secrets are missing."
            exit 1
          fi

      # 4b. Decode and validate google-services.json (required for default_web_client_id & Firebase Auth)
      - name: Configure Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          GS_FILE="${GITHUB_WORKSPACE}/app/google-services.json"

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GS_FILE"
            echo "Decoded app/google-services.json from GitHub secret."
          elif [ -f "$GS_FILE" ]; then
            echo "Using repository app/google-services.json."
          else
            echo "::error::app/google-services.json is missing and GOOGLE_SERVICES_JSON_BASE64 secret is not set. Commit app/google-services.json or set GOOGLE_SERVICES_JSON_BASE64 in GitHub Secrets so default_web_client_id is generated."
            exit 1
          fi

          if ! grep -qE '"client_type"\s*:\s*3' "$GS_FILE"; then
            echo "::error::app/google-services.json does not include an OAuth Web Client (client_type: 3). Enable Google Sign-In in Firebase Console, re-download google-services.json, and update the repository file or GOOGLE_SERVICES_JSON_BASE64 secret."
            exit 1
          fi

          echo "Verified app/google-services.json contains OAuth Web Client (client_type: 3)."

      # 5a. Run unit tests (fail fast on deterministic test/compile errors; retry only transient network failures)
      - name: Run unit tests
        shell: bash
        run: |
          attempt=1
          max_attempts=3
          log_file="${GITHUB_WORKSPACE}/gradle-test.log"

          while true; do
            echo "Unit test attempt: $attempt/$max_attempts"

            set +e
            gradle \
              :app:testDebugUnitTest \
              --no-daemon \
              --no-configuration-cache \
              --console=plain 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Unit tests passed."
              break
            fi

            if grep -qE "There were failing tests|Compilation error|Unresolved reference" "$log_file"; then
              echo "::error::Unit tests failed with a deterministic test or compilation failure. Stopping without retry."
              exit "$status"
            fi

            if ! grep -qE "MavenArtifactFetcher|HttpURLConnection|ConnectException|SocketTimeoutException|UnknownHostException|Read timed out|Connection reset|Could not resolve|502|503|504" "$log_file"; then
              echo "::error::Unit tests failed with a non-transient error. Stopping without retry."
              exit "$status"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Unit tests failed after $max_attempts attempts."
              exit "$status"
            fi

            delay=$((attempt * 30))
            echo "::warning::Transient network/dependency error detected. Retrying in ${delay} seconds."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      # 5b. Build release APK (fail fast on compile/packaging errors; retry only transient network failures)
      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          attempt=1
          max_attempts=3
          log_file="${GITHUB_WORKSPACE}/gradle-release.log"

          while true; do
            echo "Release build attempt: $attempt/$max_attempts"

            set +e
            gradle \
              :app:assembleRelease \
              --no-daemon \
              --no-configuration-cache \
              --console=plain 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Release APK build successful."
              break
            fi

            if ! grep -qE "HttpURLConnection|ConnectException|SocketTimeoutException|UnknownHostException|Read timed out|Connection reset|Could not resolve|502|503|504" "$log_file"; then
              echo "::error::Release APK build failed with a deterministic error. Stopping without retry."
              exit "$status"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Release APK build failed after $max_attempts attempts."
              exit "$status"
            fi

            delay=$((attempt * 30))
            echo "::warning::Transient network/dependency error detected. Retrying in ${delay} seconds."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      # 6. Prepare APK
      - name: Prepare APK release artifact
        id: artifact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          mkdir -p "${GITHUB_WORKSPACE}/release_assets"

          OUT_APK="${GITHUB_WORKSPACE}/release_assets/guava-doctor-${TAG}.apk"

          cp \
            "${GITHUB_WORKSPACE}/app/build/outputs/apk/release/app-release.apk" \
            "$OUT_APK"

          VERSION_CODE=$(grep -E 'versionCode\s*=' "${GITHUB_WORKSPACE}/app/build.gradle.kts" | head -n 1 | grep -oE '[0-9]+')
          BODY_FILE="${GITHUB_WORKSPACE}/release_assets/release_body.md"
          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$CUSTOM_NOTES" ]; then
            printf '%s\n\nVersion: %s\nversionCode: %s\n\nSigned Android APK with release keystore.\n' \
              "$CUSTOM_NOTES" "$TAG" "$VERSION_CODE" > "$BODY_FILE"
          else
            printf '%s\n' \
              "### English" \
              "- Modern Home Page: Redesigned card-based layout with cleaner typography, Health Tools, and Quick Scan Tips." \
              "- Account-Protected History & Insights: Scan history and orchard analytics sync and display securely when signed in." \
              "- Google Sign-In & Auth Polish: Fixed Google Sign-In web client configuration and simplified the Registration screen." \
              "- Redesigned Update Popup: Cleaner floating popup with structured bilingual highlights and instant progress tracking." \
              "- Stability & Performance: Smoother navigation and verified automated test coverage." \
              "" \
              "### বাংলা" \
              "- আধুনিক হোম পেজ: পরিষ্কার টাইপোগ্রাফি, হেলথ টুলস ও দ্রুত স্ক্যান টিপসসহ নতুন কার্ড-ভিত্তিক ডিজাইন।" \
              "- লগিন-সুরক্ষিত হিস্ট্রি ও ইনসাইটস: অ্যাকাউন্টে লগিন করলে স্ক্যান হিস্ট্রি ও বাগান বিশ্লেষণ নিরাপদে দেখা ও সিঙ্ক করা যাবে।" \
              "- উন্নত লগিন ও Google সাইন-ইন সমাধান: Google সাইন-ইন কনফিগারেশন ত্রুটি দূর করা হয়েছে এবং রেজিস্ট্রেশন পেজ সহজ করা হয়েছে।" \
              "- সুন্দর ও অপটিমাইজড আপডেট পপআপ: নতুন সংস্করণের পরিবর্তনগুলো এখন বাংলা ও ইংরেজিতে সুন্দরভাবে গুছিয়ে দেখা যাবে।" \
              "- দ্রুত পারফরম্যান্স ও স্থায়িত্ব: অ্যাপের গতি বাড়ানো হয়েছে এবং গুরুত্বপূর্ণ বাগ সমাধান করা হয়েছে।" \
              "" \
              "Version: ${TAG}" \
              "versionCode: ${VERSION_CODE}" \
              "" \
              "Signed Android APK with release keystore." > "$BODY_FILE"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "body_path=${BODY_FILE}" >> "$GITHUB_OUTPUT"

          echo "APK prepared: guava-doctor-${TAG}.apk (versionCode=${VERSION_CODE})"

      # 7. Verify APK signature
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose \
            "${{ steps.artifact.outputs.apk_path }}"

          echo "APK signature verified."

      # 8. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Guava Doctor ${{ steps.artifact.outputs.tag }}
          body_path: ${{ steps.artifact.outputs.body_path }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: ${{ steps.artifact.outputs.apk_path }}
