
name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.0)'
        required: true
        default: 'v3.0'

      release_notes:
        description: 'Optional release notes (Bangla / English)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Setup Gradle with caching
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Decode signing keystore
      - name: Decode keystore
        id: signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode \
              > "${GITHUB_WORKSPACE}/my-upload-key.jks"

            chmod 600 "${GITHUB_WORKSPACE}/my-upload-key.jks"

            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Release signing configured."

          else
            echo "::error::Release signing secrets are missing."
            exit 1
          fi

      # 4b. Decode and validate google-services.json (required for default_web_client_id & Firebase Auth)
      - name: Configure Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          GS_FILE="${GITHUB_WORKSPACE}/app/google-services.json"
          CLEAN_B64=$(printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]')

          if [ -n "$CLEAN_B64" ]; then
            mkdir -p "$(dirname "$GS_FILE")"
            if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$GS_FILE" 2>/dev/null; then
              rm -f "$GS_FILE"
              echo "::error::Failed to base64-decode GOOGLE_SERVICES_JSON_BASE64. Verify the secret contains a valid base64-encoded app/google-services.json file."
              exit 1
            fi
            if [ ! -s "$GS_FILE" ]; then
              rm -f "$GS_FILE"
              echo "::error::Decoded app/google-services.json is empty. Verify the GOOGLE_SERVICES_JSON_BASE64 secret."
              exit 1
            fi
            chmod 600 "$GS_FILE"
            echo "Decoded app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -s "$GS_FILE" ]; then
            echo "Using repository app/google-services.json."
          else
            echo "::error::Firebase configuration is missing: app/google-services.json was not found and GOOGLE_SERVICES_JSON_BASE64 secret is not set. Add GOOGLE_SERVICES_JSON_BASE64 in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          python3 - "$GS_FILE" "${GITHUB_WORKSPACE}/app/build.gradle.kts" <<'PY'
          import json
          import re
          import sys

          gs_path, gradle_path = sys.argv[1], sys.argv[2]

          try:
              with open(gs_path, "r", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception:
              print("::error::app/google-services.json is not valid JSON. Re-encode a valid google-services.json file into GOOGLE_SERVICES_JSON_BASE64.")
              sys.exit(1)

          if not isinstance(data, dict):
              print("::error::app/google-services.json root must be a JSON object.")
              sys.exit(1)

          project_info = data.get("project_info")
          project_id = project_info.get("project_id", "").strip() if isinstance(project_info, dict) else ""
          if not project_id or project_id == "remixed-project-id":
              print("::error::app/google-services.json is missing a valid Firebase project_info.project_id.")
              sys.exit(1)

          clients = data.get("client")
          if not isinstance(clients, list) or not clients:
              print("::error::app/google-services.json does not contain any Firebase client entries.")
              sys.exit(1)

          expected_pkg = None
          try:
              with open(gradle_path, "r", encoding="utf-8") as gfh:
                  match = re.search(r'applicationId\s*=\s*"([^"]+)"', gfh.read())
                  if match:
                      expected_pkg = match.group(1).strip()
          except Exception:
              expected_pkg = None

          matching_clients = []
          for client in clients:
              if not isinstance(client, dict):
                  continue
              pkg = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name", "")
              )
              if expected_pkg is None or pkg == expected_pkg:
                  matching_clients.append(client)

          if expected_pkg and not matching_clients:
              print("::error::app/google-services.json does not contain a Firebase Android client matching this app's applicationId.")
              sys.exit(1)

          def has_web_oauth_client(client_obj):
              candidates = []
              oauth_list = client_obj.get("oauth_client")
              if isinstance(oauth_list, list):
                  candidates.extend(oauth_list)
              other_list = (
                  client_obj.get("services", {})
                  .get("appinvite_service", {})
                  .get("other_platform_oauth_client")
              )
              if isinstance(other_list, list):
                  candidates.extend(other_list)
              for entry in candidates:
                  if (
                      isinstance(entry, dict)
                      and entry.get("client_type") == 3
                      and isinstance(entry.get("client_id"), str)
                      and entry.get("client_id").strip() != ""
                  ):
                      return True
              return False

          if not any(has_web_oauth_client(c) for c in matching_clients):
              print("::error::app/google-services.json does not include an OAuth Web Client (client_type: 3 with a non-empty client_id). Enable Google Sign-In in Firebase Console, re-download google-services.json, and update GOOGLE_SERVICES_JSON_BASE64.")
              sys.exit(1)

          print("Verified app/google-services.json: valid JSON, matching Android client, and OAuth Web Client (client_type: 3) present.")
          PY

      # 5a. Run unit tests (fail fast on deterministic test/compile errors; retry only transient network failures)
      - name: Run unit tests
        shell: bash
        run: |
          attempt=1
          max_attempts=3
          log_file="${GITHUB_WORKSPACE}/gradle-test.log"

          while true; do
            echo "Unit test attempt: $attempt/$max_attempts"

            set +e
            gradle \
              :app:testDebugUnitTest \
              --no-daemon \
              --no-configuration-cache \
              --console=plain 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Unit tests passed."
              break
            fi

            if grep -qE "There were failing tests|Compilation error|Unresolved reference" "$log_file"; then
              echo "::error::Unit tests failed with a deterministic test or compilation failure. Stopping without retry."
              exit "$status"
            fi

            if ! grep -qE "MavenArtifactFetcher|HttpURLConnection|ConnectException|SocketTimeoutException|UnknownHostException|Read timed out|Connection reset|Could not resolve|502|503|504" "$log_file"; then
              echo "::error::Unit tests failed with a non-transient error. Stopping without retry."
              exit "$status"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Unit tests failed after $max_attempts attempts."
              exit "$status"
            fi

            delay=$((attempt * 30))
            echo "::warning::Transient network/dependency error detected. Retrying in ${delay} seconds."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      # 5b. Build release APK (fail fast on compile/packaging errors; retry only transient network failures)
      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          attempt=1
          max_attempts=3
          log_file="${GITHUB_WORKSPACE}/gradle-release.log"

          while true; do
            echo "Release build attempt: $attempt/$max_attempts"

            set +e
            gradle \
              :app:assembleRelease \
              --no-daemon \
              --no-configuration-cache \
              --console=plain 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Release APK build successful."
              break
            fi

            if ! grep -qE "HttpURLConnection|ConnectException|SocketTimeoutException|UnknownHostException|Read timed out|Connection reset|Could not resolve|502|503|504" "$log_file"; then
              echo "::error::Release APK build failed with a deterministic error. Stopping without retry."
              exit "$status"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Release APK build failed after $max_attempts attempts."
              exit "$status"
            fi

            delay=$((attempt * 30))
            echo "::warning::Transient network/dependency error detected. Retrying in ${delay} seconds."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      # 6. Prepare APK
      - name: Prepare APK release artifact
        id: artifact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          mkdir -p "${GITHUB_WORKSPACE}/release_assets"

          OUT_APK="${GITHUB_WORKSPACE}/release_assets/guava-doctor-${TAG}.apk"

          cp \
            "${GITHUB_WORKSPACE}/app/build/outputs/apk/release/app-release.apk" \
            "$OUT_APK"

          VERSION_CODE=$(grep -E 'versionCode\s*=' "${GITHUB_WORKSPACE}/app/build.gradle.kts" | head -n 1 | grep -oE '[0-9]+')
          BODY_FILE="${GITHUB_WORKSPACE}/release_assets/release_body.md"
          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$CUSTOM_NOTES" ]; then
            printf '%s\n' "$CUSTOM_NOTES" > "$BODY_FILE"
          else
            printf '%s\n' \
              "### English" \
              "- Reliable Google Sign-In: Upgraded login flow with automatic official Firebase OAuth fallback and smoother cloud session handling." \
              "- Streamlined Home & Navigation: Settings-only top bar, Profile tab right in the bottom bar for signed-in growers, and a dedicated Orchard Insights card above Recent Scans." \
              "- Cleaner Settings & About Pages: Removed redundant Grower Account card from Settings and simplified About page quick actions." \
              "- Smarter Bilingual Updates: What's New dropdown now shows clean, language-matched release highlights without clutter." \
              "- Verified Stability: Full automated unit and Compose UI test coverage for dependable everyday orchard scanning." \
              "" \
              "### বাংলা" \
              "- নির্ভরযোগ্য Google সাইন-ইন: অটোমেটিক অফিসিয়াল Firebase OAuth ফলব্যাকসহ আরও সহজ ও স্থায়ী গুগল লগইন অভিজ্ঞতা।" \
              "- গোছানো হোম পেজ ও নেভিগেশন: টপ বারে শুধু সেটিংস, লগইনকৃত ব্যবহারকারীদের জন্য বটম বারে প্রোফাইল ট্যাব এবং রিসেন্ট স্ক্যানের উপরে ডেডিকেটেড Orchard Insights কার্ড।" \
              "- পরিচ্ছন্ন সেটিংস ও অ্যাবাউট পেজ: সেটিংস থেকে অতিরিক্ত অ্যাকাউন্ট কার্ড এবং অ্যাবাউট পেজের অপ্রয়োজনীয় শর্টকাট সরানো হয়েছে।" \
              "- স্মার্ট বাংলা-ইংরেজি আপডেট তালিকা: নির্বাচিত ভাষা অনুযায়ী What's New ড্রপডাউনে পরিষ্কার আপডেট তথ্য।" \
              "- যাচাইকৃত স্থায়িত্ব ও পারফরম্যান্স: সম্পূর্ণ অটোমেটেড টেস্ট কভারেজসহ দ্রুত ও নির্ভরযোগ্য স্ক্যানিং।" > "$BODY_FILE"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "body_path=${BODY_FILE}" >> "$GITHUB_OUTPUT"

          echo "APK prepared: guava-doctor-${TAG}.apk (versionCode=${VERSION_CODE})"

      # 7. Verify APK signature
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose \
            "${{ steps.artifact.outputs.apk_path }}"

          echo "APK signature verified."

      # 8. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Guava Doctor ${{ steps.artifact.outputs.tag }}
          body_path: ${{ steps.artifact.outputs.body_path }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: ${{ steps.artifact.outputs.apk_path }}
